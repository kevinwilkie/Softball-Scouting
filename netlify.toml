# Netlify: this is a static site with no build step. Serve the repo root as-is.
[build]
  publish = "."
  command = ""

# Long-cache the immutable assets but always revalidate the shell + service worker
# so updates reach devices promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
