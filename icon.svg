<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Trojan / Spartan helmet, facing LEFT. Gold with black detailing. -->
  <g stroke="#0a0b0e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">

    <!-- Crest plume: bold scalloped mohawk sweeping up and back -->
    <path fill="#c9a227" d="M226 168
      C 206 104 276 74 344 92
      C 408 110 432 172 408 226
      C 400 198 380 180 356 176
      C 368 194 368 216 356 234
      C 346 208 326 194 304 194
      C 314 210 312 230 302 244
      C 292 220 272 208 252 210
      C 244 196 234 182 226 168 Z"/>

    <!-- Helmet bowl -->
    <path fill="#c9a227" d="M196 372
      C 178 330 174 280 186 236
      C 200 186 244 158 300 162
      C 356 166 396 210 398 268
      C 400 318 376 360 332 376
      L 332 400
      C 332 412 322 420 310 420
      L 286 420
      C 286 402 286 388 286 380
      C 250 380 220 380 196 372 Z"/>

    <!-- Nose / face guard bar to the left -->
    <path fill="#c9a227" d="M186 250
      L 138 250
      C 128 250 122 258 122 268
      L 122 314
      C 122 324 130 332 140 332
      L 190 332
      C 184 306 184 276 186 250 Z"/>

    <!-- Eye slit (black) -->
    <rect fill="#0a0b0e" stroke="none" x="150" y="270" width="60" height="26" rx="10"/>

    <!-- Cheek plate -->
    <path fill="#c9a227" d="M300 340
      C 324 340 344 336 344 336
      L 344 392
      C 344 402 336 410 326 410
      L 306 410
      C 306 386 302 362 300 340 Z"/>

    <!-- Separation line between crest and bowl -->
    <path fill="none" stroke="#0a0b0e" stroke-width="7" d="M214 196 C 244 176 286 172 320 186"/>
  </g>
</svg>
