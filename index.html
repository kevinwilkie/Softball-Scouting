<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Carrollton Trojans Pitch Scout</title>
  <link rel="icon" href="icon.svg?v=21" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg?v=21" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <button id="nav-btn" class="nav-btn" aria-label="Menu">&#9776;</button>
      <img class="brand-mark" src="icon.svg?v=21" alt="Carrollton Trojans" />
      <div class="brand-text">
        <h1>Trojans Pitch Scout</h1>
        <p>Carrollton High School Softball</p>
      </div>
    </div>
  </header>

  <main id="view-root"></main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="pitchers">
      <span class="tab-icon">&#128101;</span>
      <span>Roster</span>
    </button>
    <button class="tab-btn" data-tab="schedule">
      <span class="tab-icon">&#128197;</span>
      <span>Schedule</span>
    </button>
    <button class="tab-btn" data-tab="chart">
      <span class="tab-icon">&#129358;</span>
      <span>Chart</span>
    </button>
    <button class="tab-btn" data-tab="abscout">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.44 19.84 L21.04 6.64 A2.6 2.6 0 0 0 17.36 2.96 L4.16 18.56 A0.9 0.9 0 0 0 5.44 19.84 Z"/><circle cx="4.2" cy="19.8" r="1.7"/></svg></span>
      <span>At Bat</span>
    </button>
    <button class="tab-btn" data-tab="stats">
      <span class="tab-icon">&#9636;</span>
      <span>Stats</span>
    </button>
  </nav>

  <!-- Slide-out navigation drawer -->
  <div id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-backdrop"></div>
    <nav class="drawer-panel"></nav>
  </div>

  <!-- Modal host -->
  <div id="modal-host" class="modal-host hidden"></div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
