name: Deploy to GitHub Pages

# Publishes the static app to GitHub Pages. Runs on pushes to the main
# branch or the active development branch, and can be triggered manually.
on:
  push:
    branches:
      - main
      - master
      - claude/softball-pitcher-scout-app-pnr73x
  workflow_dispatch:

# Allow this workflow to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The app is a static site living at the repo root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
